name: selfhost-image

# 在自己的 fork 里构建含 LLM Accept 修复的镜像并推送到 GHCR：
#   ghcr.io/<owner>/antifox:latest
#   ghcr.io/<owner>/antifox:patched
#   ghcr.io/<owner>/antifox:patched-<sha>
#
# 只在本分支（selfhost）上生效，不会影响提给上游的 PR 分支。
on:
  push:
    branches: ["selfhost"]
    paths:
      - "engine/**"
      - "web/**"
      - "server/**"
      - "skills/**"
      - "go.mod"
      - "go.sum"
      - "deploy/patched/Dockerfile.local"
      - ".github/workflows/patched-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: selfhost-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/antifox
          tags: |
            type=raw,value=latest
            type=raw,value=patched
            type=sha,prefix=patched-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/patched/Dockerfile.local
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=patched-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
